name: realplaza-reto
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realplaza}
      POSTGRES_USER: ${POSTGRES_USER:-realplaza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta bash scripts/configurar.sh}
    ports:
      - "127.0.0.1:${DB_PORT:-54329}:5432"
    volumes:
      - realplaza_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  realplaza_data:
