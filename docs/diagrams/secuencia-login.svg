<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1210" viewBox="0 0 1320 1210"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#79698e"/></marker></defs><rect width="100%" height="100%" fill="#f8f7fc"/><rect x="30" y="25" width="1260" height="50" rx="0" fill="#f8f7fc" stroke="#f8f7fc"/><text x="46" y="60.5" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#30233f">Secuencia / Inicio de sesión</text><rect x="30" y="82" width="1260" height="35" rx="0" fill="#f8f7fc" stroke="#f8f7fc"/><text x="46" y="104.75" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#8a769b">Credenciales verificadas contra el usuario creado por el script SQL.</text><rect x="35" y="145" width="210" height="70" rx="12" fill="#35204f" stroke="#35204f"/><text x="140.0" y="174.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Navegador</text><text x="140.0" y="195.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Interfaz React</text><line x1="140" y1="216" x2="140" y2="1130" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" /><rect x="380" y="145" width="210" height="70" rx="12" fill="#35204f" stroke="#35204f"/><text x="485.0" y="174.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Next.js</text><text x="485.0" y="195.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Route Handler / BFF</text><line x1="485" y1="216" x2="485" y2="1130" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" /><rect x="720" y="145" width="210" height="70" rx="12" fill="#35204f" stroke="#35204f"/><text x="825.0" y="174.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">API .NET 8</text><text x="825.0" y="195.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Lógica de negocio</text><line x1="825" y1="216" x2="825" y2="1130" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" /><rect x="1065" y="145" width="210" height="70" rx="12" fill="#35204f" stroke="#35204f"/><text x="1170.0" y="174.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">PostgreSQL</text><text x="1170.0" y="195.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Usuarios / Tiendas</text><line x1="1170" y1="216" x2="1170" y2="1130" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" /><line x1="140" y1="270" x2="485" y2="270" stroke="#79698e" stroke-width="2"  marker-end="url(#arrow)"/><text x="312.5" y="242.1" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">1. POST /api/auth/login</text><text x="312.5" y="261.0" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">{ usuario, password }</text><rect x="370" y="295" width="230" height="53" rx="12" fill="#f1eafa" stroke="#e0d8ed"/><text x="485.0" y="326.05" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#30233f">Validar Origin y formato JSON</text><line x1="485" y1="385" x2="825" y2="385" stroke="#79698e" stroke-width="2"  marker-end="url(#arrow)"/><text x="655.0" y="376.0" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">2. POST /api/auth/login</text><line x1="825" y1="460" x2="1170" y2="460" stroke="#79698e" stroke-width="2"  marker-end="url(#arrow)"/><text x="997.5" y="451.0" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">3. SELECT usuario por nombre</text><line x1="1170" y1="535" x2="825" y2="535" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="997.5" y="526.0" font-size="13" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">4. Usuario + password_hash + activo</text><rect x="687" y="558" width="276" height="84" rx="12" fill="#eaf5f3" stroke="#e0d8ed"/><text x="825.0" y="585.3" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">5. PBKDF2-SHA256</text><text x="825.0" y="604.9" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">Comparación en tiempo constante</text><text x="825.0" y="624.5" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">Usuario activo + credenciales válidas</text><rect x="687" y="665" width="276" height="58" rx="12" fill="#eaf5f3" stroke="#e0d8ed"/><text x="825.0" y="698.9" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">6. Firmar JWT HS256 · 60 minutos</text><line x1="825" y1="770" x2="485" y2="770" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="655.0" y="761.0" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">7. 200 { token, expiresAt, usuario }</text><rect x="354" y="792" width="262" height="64" rx="12" fill="#f1eafa" stroke="#e0d8ed"/><text x="485.0" y="819.4499999999999" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#30233f">8. Guardar JWT en cookie HttpOnly</text><text x="485.0" y="837.65" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#30233f">SameSite=Strict; Secure con HTTPS</text><line x1="485" y1="900" x2="140" y2="900" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="312.5" y="873.45" font-size="13" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">9. 200 { usuario } + Set-Cookie</text><text x="312.5" y="891.0" font-size="13" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">El cuerpo al navegador no expone JWT</text><rect x="35" y="934" width="270" height="67" rx="12" fill="#f1eafa" stroke="#e0d8ed"/><text x="170.0" y="962.9499999999999" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#30233f">10. Redirigir a /tiendas</text><text x="170.0" y="981.15" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#30233f">Validar sesión con GET /api/auth/me</text><rect x="340" y="1040" width="930" height="88" rx="12" fill="#fff4e8" stroke="#f1d6b4"/><text x="356" y="1069.3000000000002" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#30233f">Alternativas: credenciales inválidas / usuario inactivo → 401. Datos inválidos → 400.</text><text x="356" y="1088.9" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#30233f">Más de 20 intentos por minuto e IP del llamador → 429. Origin distinto → 403 en Next.js.</text><text x="356" y="1108.5000000000002" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#30233f">En esta demo, las peticiones del BFF comparten la misma IP hacia la API.</text></svg>