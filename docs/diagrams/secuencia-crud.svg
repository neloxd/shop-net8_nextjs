<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1310" viewBox="0 0 1320 1310"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#79698e"/></marker></defs><rect width="100%" height="100%" fill="#f8f7fc"/><rect x="30" y="25" width="1260" height="50" rx="0" fill="#f8f7fc" stroke="#f8f7fc"/><text x="46" y="60.5" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#30233f">Secuencia / Crear, editar y eliminar tiendas</text><rect x="30" y="82" width="1260" height="35" rx="0" fill="#f8f7fc" stroke="#f8f7fc"/><text x="46" y="104.75" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#8a769b">El mismo recorrido aplica a POST /api/tiendas, PUT /api/tiendas/{id} y DELETE /api/tiendas/{id}.</text><rect x="35" y="145" width="210" height="70" rx="12" fill="#35204f" stroke="#35204f"/><text x="140.0" y="174.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Navegador</text><text x="140.0" y="195.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Interfaz React</text><line x1="140" y1="216" x2="140" y2="1230" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" /><rect x="380" y="145" width="210" height="70" rx="12" fill="#35204f" stroke="#35204f"/><text x="485.0" y="174.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Next.js</text><text x="485.0" y="195.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Route Handler / BFF</text><line x1="485" y1="216" x2="485" y2="1230" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" /><rect x="720" y="145" width="210" height="70" rx="12" fill="#35204f" stroke="#35204f"/><text x="825.0" y="174.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">API .NET 8</text><text x="825.0" y="195.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Lógica de negocio</text><line x1="825" y1="216" x2="825" y2="1230" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" /><rect x="1065" y="145" width="210" height="70" rx="12" fill="#35204f" stroke="#35204f"/><text x="1170.0" y="174.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">PostgreSQL</text><text x="1170.0" y="195.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Usuarios / Tiendas</text><line x1="1170" y1="216" x2="1170" y2="1230" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" /><rect x="35" y="249" width="250" height="80" rx="12" fill="#f1eafa" stroke="#e0d8ed"/><text x="160.0" y="275.35" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#30233f">1. Formulario + validación Zod</text><text x="160.0" y="293.55" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#30233f">Nombre · Categoría · Activo</text><text x="160.0" y="311.75" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#30233f">Eliminar requiere confirmación</text><line x1="140" y1="380" x2="485" y2="380" stroke="#79698e" stroke-width="2"  marker-end="url(#arrow)"/><text x="312.5" y="352.1" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">2. POST / PUT / DELETE</text><text x="312.5" y="371.0" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">Cookie de sesión + JSON</text><rect x="355" y="406" width="260" height="74" rx="12" fill="#f1eafa" stroke="#e0d8ed"/><text x="485.0" y="438.09999999999997" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">3. Validar Origin y ruta permitida</text><text x="485.0" y="457.7" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">Leer JWT de cookie HttpOnly</text><line x1="485" y1="535" x2="825" y2="535" stroke="#79698e" stroke-width="2"  marker-end="url(#arrow)"/><text x="655.0" y="507.1" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">4. Solicitud con Authorization:</text><text x="655.0" y="526.0" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">Bearer &lt;JWT&gt;</text><rect x="687" y="560" width="276" height="96" rx="12" fill="#eaf5f3" stroke="#e0d8ed"/><text x="825.0" y="583.5" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">5. Validar firma, issuer, audience</text><text x="825.0" y="603.1" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">y expiración del JWT</text><text x="825.0" y="622.7" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">Validar DTO de entrada</text><text x="825.0" y="642.3" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">TiendaService + AppDbContext</text><line x1="825" y1="710" x2="1170" y2="710" stroke="#79698e" stroke-width="2"  marker-end="url(#arrow)"/><text x="997.5" y="682.1" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">6. INSERT / UPDATE / DELETE</text><text x="997.5" y="701.0" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">SQL parametrizado</text><rect x="1050" y="739" width="240" height="64" rx="12" fill="#eaf5f3" stroke="#e0d8ed"/><text x="1170.0" y="766.4499999999999" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#30233f">7. Restricciones de integridad</text><text x="1170.0" y="784.65" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#30233f">y persistencia de cambios</text><line x1="1170" y1="854" x2="825" y2="854" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="997.5" y="845.0" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">8. Registro / filas afectadas</text><line x1="825" y1="927" x2="485" y2="927" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="655.0" y="918.0" font-size="13" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">9. Crear 201 / Editar 200 / Eliminar 204</text><line x1="485" y1="1000" x2="140" y2="1000" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="312.5" y="991.0" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">10. Resultado al navegador</text><rect x="35" y="1024" width="260" height="69" rx="12" fill="#f1eafa" stroke="#e0d8ed"/><text x="165.0" y="1053.95" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#30233f">11. Actualizar tabla y contadores</text><text x="165.0" y="1072.15" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#30233f">Mostrar confirmación al usuario</text><rect x="340" y="1132" width="930" height="96" rx="12" fill="#fff4e8" stroke="#f1d6b4"/><text x="356" y="1155.5" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#30233f">Alternativas: sin JWT o vencido → 401. Datos inválidos → 400. ID inexistente → 404.</text><text x="356" y="1175.1" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#30233f">Next.js elimina la cookie al recibir 401; la UI redirige a /login?expired=1.</text><text x="356" y="1194.7" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#30233f">Listado: GET /api/tiendas → SELECT → 200; la API permite lectura pública según el enunciado,</text><text x="356" y="1214.3" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#30233f">mientras el directorio web exige una sesión.</text></svg>