<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#79698e"/></marker></defs><rect width="100%" height="100%" fill="#f8f7fc"/><rect x="30" y="25" width="1260" height="50" rx="0" fill="#f8f7fc" stroke="#f8f7fc"/><text x="46" y="60.5" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#30233f">Secuencia / Cierre de sesión</text><rect x="30" y="82" width="1260" height="35" rx="0" fill="#f8f7fc" stroke="#f8f7fc"/><text x="46" y="104.75" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#8a769b">El JWT es stateless. El cierre de sesión elimina la cookie del navegador.</text><rect x="35" y="145" width="210" height="70" rx="12" fill="#35204f" stroke="#35204f"/><text x="140.0" y="174.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Navegador</text><text x="140.0" y="195.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Interfaz React</text><line x1="140" y1="216" x2="140" y2="770" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" /><rect x="380" y="145" width="210" height="70" rx="12" fill="#35204f" stroke="#35204f"/><text x="485.0" y="174.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Next.js</text><text x="485.0" y="195.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Route Handler / BFF</text><line x1="485" y1="216" x2="485" y2="770" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" /><rect x="720" y="145" width="210" height="70" rx="12" fill="#35204f" stroke="#35204f"/><text x="825.0" y="174.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">API .NET 8</text><text x="825.0" y="195.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Lógica de negocio</text><line x1="825" y1="216" x2="825" y2="770" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" /><rect x="1065" y="145" width="210" height="70" rx="12" fill="#35204f" stroke="#35204f"/><text x="1170.0" y="174.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">PostgreSQL</text><text x="1170.0" y="195.75" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">Usuarios / Tiendas</text><line x1="1170" y1="216" x2="1170" y2="770" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" /><line x1="140" y1="290" x2="485" y2="290" stroke="#79698e" stroke-width="2"  marker-end="url(#arrow)"/><text x="312.5" y="262.1" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">1. POST /api/auth/logout</text><text x="312.5" y="281.0" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">Cookie y cabecera Origin</text><rect x="355" y="320" width="260" height="78" rx="12" fill="#f1eafa" stroke="#e0d8ed"/><text x="485.0" y="344.29999999999995" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">2. Validar Origin</text><text x="485.0" y="363.9" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">Set-Cookie rp_session vacía</text><text x="485.0" y="383.49999999999994" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">Max-Age=0</text><line x1="485" y1="460" x2="140" y2="460" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="312.5" y="451.0" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">3. 200 · Sesión cerrada</text><rect x="35" y="491" width="260" height="64" rx="12" fill="#f1eafa" stroke="#e0d8ed"/><text x="165.0" y="518.1" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">4. Redirigir a /login</text><text x="165.0" y="537.7" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#30233f">La cookie ya no está disponible</text><line x1="140" y1="625" x2="485" y2="625" stroke="#79698e" stroke-width="2"  marker-end="url(#arrow)"/><text x="312.5" y="616.0" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">5. Intentar abrir /tiendas</text><line x1="485" y1="700" x2="140" y2="700" stroke="#79698e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="312.5" y="691.0" font-size="13" font-family="Arial,sans-serif" text-anchor="middle" fill="#675778" stroke="#f8f7fc" stroke-width="4" paint-order="stroke">6. Sin cookie → redirigir a /login</text><rect x="690" y="330" width="560" height="117" rx="12" fill="#fff4e8" stroke="#f1d6b4"/><text x="706" y="362.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#30233f">La API y la base no reciben una petición de logout.</text><text x="706" y="383.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#30233f">Un JWT previamente copiado sigue siendo válido</text><text x="706" y="404.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#30233f">hasta su expiración (60 min). No hay refresh tokens</text><text x="706" y="425.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#30233f">ni lista de revocación en el alcance de este reto.</text></svg>